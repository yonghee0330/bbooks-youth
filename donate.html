<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후원 참여 · 청소년 책사줄게</title>
<meta name="description" content="책 한 권 값(2만 원)부터 함께해요. 1권 · 5권 · 50권, 익명(키다리아저씨)·기관 참여도 돼요.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="후원 참여 · 청소년 책사줄게">
<meta property="og:description" content="책 한 권 값(2만 원)부터 함께해요. 1권 · 5권 · 50권, 익명(키다리아저씨)·기관 참여도 돼요.">
<!-- 배포 후 절대 주소로 바꾸기: 예) https://yonghee0330.github.io/youth-book-gift/images/og.jpg -->
<meta property="og:image" content="https://youth.bbooks.co.kr/images/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%226%22 y=%224%22 width=%228%22 height=%2224%22 rx=%221%22 fill=%22%231f3b2d%22/%3E%3Crect x=%2216%22 y=%228%22 width=%228%22 height=%2220%22 rx=%221%22 fill=%22%23e0662b%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=20261108f">
</head>
<body data-page="donate" data-side="adult">
<a class="skip" href="#content">본문으로 바로 가기</a>
<header class="topbar" id="site-header"></header>

<main id="content" class="sub">
<div class="wrap">
  <p class="who">후원 참여</p>
  <h1 class="page-title" id="donate-title">책 한 권 값부터 함께해요</h1>
  <ol class="comic" data-comic="donate" aria-label="후원금이 어떻게 쓰이는지 네 컷"></ol>
</div>

<div class="wrap narrow">
  <section class="part" id="amount">
    <h2>몇 권을 연결할까요?</h2>
    <p class="donors-now" id="donors-now"></p>
    <fieldset class="amounts">
      <legend class="visually-hidden">후원 금액</legend>
      <div class="amount-btns" id="amount-btns"></div>
      <label class="free-amount">
        <span class="free-label">5권 이상<b>10만 원 이상</b></span>
        <input id="free-amount" type="text" inputmode="numeric" placeholder="원하는 만큼 직접 입력" autocomplete="off">
        <span>원</span>
      </label>
      <p class="books-calc" id="books-calc" aria-live="polite" hidden></p>
    </fieldset>
    <div class="account" id="account"></div>
    <button type="button" class="btn btn-primary btn-wide" id="d-open">책사줄게 참여하기</button>
  </section>

  <form class="apply-form" id="donate-form" novalidate hidden>
    <h2 class="form-h">책사줄게 참여</h2>
    <p class="small">입금과 함께 아래를 보내주세요. 입금이 확인되면 서가에 책이 꽂혀요.</p>
    <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <fieldset class="f-row seg"><legend>누가 함께하나요</legend>
      <label><input type="radio" name="kind" value="개인" checked><span>개인</span></label>
      <label><input type="radio" name="kind" value="기관·단체·기업·종교단체"><span>기관·단체·기업·종교단체</span></label>
    </fieldset>
    <fieldset class="f-row seg"><legend>누구에게 건넬까요</legend>
      <label><input type="radio" name="to" value="any" checked><span>부천 청소년 누구에게나</span></label>
      <label><input type="radio" name="to" value="pick"><span>지정해서 건네기</span></label>
    </fieldset>
    <div class="f-row" id="d-target-row" hidden><label for="d-target">어디에 건넬까요 <b>*</b> <em>(학교·반·모임 등)</em></label><input id="d-target" name="target" maxlength="60" placeholder="예) ○○중학교 2학년 3반, ○○청소년 독서모임"></div>
    <div class="f-row" id="d-org-row" hidden><label for="d-org">기관·단체 이름 <b>*</b></label><input id="d-org" name="org" maxlength="40" placeholder="예) ○○재단, ○○중학교 독서동아리"></div>
    <div class="f-row"><label for="d-name">이름 또는 닉네임 <b>*</b> <em>(기관이면 담당자)</em></label><input id="d-name" name="name" maxlength="30" autocomplete="name" required></div>
    <div class="f-2">
      <div class="f-row"><label for="d-phone">연락처 <b>*</b></label><input id="d-phone" name="phone" type="tel" inputmode="tel" maxlength="13" autocomplete="tel" placeholder="010-0000-0000" required></div>
      <div class="f-row"><label for="d-email">이메일 <b>*</b></label><input id="d-email" name="email" type="email" maxlength="80" autocomplete="email" required></div>
    </div>
    <div class="f-2">
      <div class="f-row"><label for="d-amount">후원 금액 <b>*</b></label><div class="f-unit"><input id="d-amount" name="amount" inputmode="numeric" maxlength="12" required><span>원</span></div></div>
      <div class="f-row"><label for="d-payer">입금자명 <b>*</b></label><input id="d-payer" name="payer" maxlength="30" required></div>
    </div>
    <label class="check anon-check"><input type="checkbox" name="anon" id="d-anon"><span><b class="plain">키다리아저씨로 참여</b> <em>(익명 — 후원현황과 서가에 이름과 한 줄이 보이지 않아요)</em></span></label>
    <div class="f-row" id="d-line-row"><label for="d-line">청소년에게 남기는 한 줄 <em>(선택)</em> <span class="cnt" id="d-line-cnt">0/40</span></label><input id="d-line" name="line" maxlength="40" placeholder="예) 네가 고른 책이 네 편이길"></div>
    <label class="check"><input type="checkbox" name="receipt" id="d-receipt"><span>현금영수증·지출증빙이 필요해요</span></label>
    <div class="f-row" id="d-receipt-row" hidden><label for="d-receiptNo">발급 번호 <em>(휴대폰 번호 또는 사업자등록번호, 비우면 연락처로)</em></label><input id="d-receiptNo" name="receiptNo" inputmode="numeric" maxlength="20"></div>
    <details class="consent-box"><summary>개인정보 수집·이용 안내</summary><div data-consent="donate"></div></details>
    <label class="check"><input type="checkbox" name="consent" required><span>개인정보 수집·이용에 동의해요 <b>*</b></span></label>
    <p class="form-msg" role="alert"></p>
    <button class="btn btn-primary btn-wide" type="submit">책사줄게 참여하기</button>
  </form>
  <div class="done" id="donate-done" hidden tabindex="-1"></div>

  <section class="part org-box" id="org">
    <h2>기관·단체·기업·종교단체라면</h2>
    <p>한 반, 한 동아리 몫을 함께 건넬 수 있어요. 참여할 때 <b>기관·단체·기업·종교단체</b>를 고르고 이름을 적어주세요. 특정 학교·반·모임을 <b>지정해서 건네기</b>도 돼요.</p>
    <div id="org-package"></div>
    <div id="org-contact" class="cta-row"></div>
  </section>
</div>
<nav class="wrap narrow page-nav" id="page-nav" aria-label="이전 다음 페이지"></nav>
</main>

<footer class="footer" id="site-footer"></footer>

<script src="config.js?v=20261108f"></script>
<script src="main.js?v=20261108f"></script>
</body>
</html>
